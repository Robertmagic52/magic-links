<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title></title>

  <!-- Native iOS Safari Smart App Banner for Apple Shortcuts (App ID: 915254993) -->
  <meta name="apple-itunes-app" content="app-id=915254993" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 20px 40px;
      user-select: none;
      -webkit-user-select: none;
    }

    .menu-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-tile {
      background-color: #161616;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      height: 72px;
      display: flex;
      align-items: center;
      padding-left: 28px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.2px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .menu-tile:active {
      background-color: #242424;
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #4b4b4b;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #222222;
    }

    .divider span {
      padding: 0 16px;
    }
  </style>
</head>
